<?xml version="1.0" encoding="UTF-8"?>
<!--
  DIAGRAMA: Evolución de arquitectura TMS — Gestión de pruebas de entrega
  AUTOR: [Tu nombre]
  FECHA: 2026
  EDITABLE CON: Inkscape, Figma, Adobe Illustrator, VS Code + SVG Preview
  VERSIONES: Fase 0 (manual) → Fase 1 (Bash + EFS + EC2) → Fase 2 (App móvil + EFS + API REST)

  DECISIONES ARQUITECTÓNICAS:
  - EFS (AWS Elastic File System) reemplaza SFTP y NAS:
      · Almacenamiento centralizado, administrado y de alta disponibilidad en AWS
      · Integración nativa con servicios AWS donde vive el TMS Web
      · Mayor seguridad y durabilidad frente a una NAS on-premise
      · Elimina el costo y soporte de hardware de escáneres y NAS
  - EC2 lee directamente de EFS sin proceso Cron adicional
  - App móvil Android conecta vía API REST al backend en AWS
      · El TMS ya está en entorno web cloud AWS, por lo tanto la API es la integración natural
      · Elimina escáneres físicos y toda la cadena de hardware local
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="900"
  height="1290"
  viewBox="0 0 900 1290"
  font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
  font-size="13"
>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <!--
      PALETA DE COLORES:
      GRAY   fill=#F1EFE8  stroke=#5F5E5A  text=#444441   → Legado / neutral
      BLUE   fill=#E6F1FB  stroke=#185FA5  text=#0C447C   → Sistema TMS / AWS EC2
      TEAL   fill=#E1F5EE  stroke=#0F6E56  text=#085041   → Infraestructura / Backend
      PURPLE fill=#EEEDFE  stroke=#534AB7  text=#3C3489   → App móvil
      AMBER  fill=#FAEEDA  stroke=#854F0B  text=#633806   → Notificaciones / Usuario
      ORANGE fill=#FFF3E0  stroke=#E65100  text=#BF360C   → AWS EFS (énfasis)
    -->
  </defs>

  <!-- ══════════════════════════════════════════════════════════
       TÍTULO GLOBAL
  ══════════════════════════════════════════════════════════ -->
  <text x="450" y="36" text-anchor="middle"
        font-size="17" font-weight="600" fill="#2C2C2A">
    Evolución de arquitectura TMS — Gestión de pruebas de entrega
  </text>
  <text x="450" y="56" text-anchor="middle"
        font-size="12" fill="#888780">
    Mejora de componentes TI · Arquitectura de Soluciones
  </text>

  <!-- ══════════════════════════════════════════════════════════
       FASE 0 — ESTADO INICIAL
  ══════════════════════════════════════════════════════════ -->
  <rect x="30" y="74" width="840" height="242" rx="16"
        fill="#F1EFE8" fill-opacity="0.5" stroke="#B4B2A9" stroke-width="1"/>
  <text x="56" y="98" font-size="14" font-weight="600" fill="#444441">
    Fase 0 — Estado inicial (proceso manual con hardware físico)
  </text>
  <text x="56" y="116" font-size="11" fill="#888780">
    Sin centralización · dependencia de escáneres físicos · actualización manual · imágenes en NAS on-premise
  </text>

  <!-- Escáner físico -->
  <g id="fase0-scanner">
    <rect x="56" y="128" width="140" height="60" rx="10"
          fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="126" y="154" text-anchor="middle" font-weight="600" fill="#444441">Escáner físico</text>
    <text x="126" y="172" text-anchor="middle" font-size="11" fill="#888780">Dispositivo local</text>
  </g>

  <!-- PC Local -->
  <g id="fase0-pc">
    <rect x="256" y="128" width="140" height="60" rx="10"
          fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="326" y="154" text-anchor="middle" font-weight="600" fill="#444441">PC local</text>
    <text x="326" y="172" text-anchor="middle" font-size="11" fill="#888780">Almacena imágenes</text>
  </g>

  <!-- NAS on-premise -->
  <g id="fase0-nas">
    <rect x="456" y="128" width="140" height="60" rx="10"
          fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="526" y="154" text-anchor="middle" font-weight="600" fill="#444441">NAS on-premise</text>
    <text x="526" y="172" text-anchor="middle" font-size="11" fill="#888780">Storage sin gestión Cloud</text>
  </g>

  <!-- TMS Web -->
  <g id="fase0-tms">
    <rect x="656" y="128" width="182" height="60" rx="10"
          fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
    <text x="747" y="154" text-anchor="middle" font-weight="600" fill="#0C447C">TMS Web</text>
    <text x="747" y="172" text-anchor="middle" font-size="11" fill="#185FA5">Actualización manual</text>
  </g>

  <!-- Arrows fase 0 -->
  <line x1="196" y1="158" x2="254" y2="158"
        stroke="#888780" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="225" y="150" text-anchor="middle" font-size="10" fill="#888780">imagen</text>

  <line x1="396" y1="158" x2="454" y2="158"
        stroke="#888780" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="425" y="150" text-anchor="middle" font-size="10" fill="#888780">copia manual</text>

  <line x1="596" y1="158" x2="654" y2="158"
        stroke="#888780" stroke-width="1.2" stroke-dasharray="5 3" marker-end="url(#arrow)"/>
  <text x="625" y="150" text-anchor="middle" font-size="10" fill="#888780">acceso manual</text>

  <!-- Pain points -->
  <rect x="56" y="206" width="782" height="96" rx="8"
        fill="#FCEBEB" fill-opacity="0.6" stroke="#F09595" stroke-width="0.8" stroke-dasharray="5 3"/>
  <text x="447" y="226" text-anchor="middle" font-size="11" font-weight="600" fill="#A32D2D">
    Problemas identificados
  </text>
  <text x="447" y="244" text-anchor="middle" font-size="11" fill="#791F1F">
    · Proceso lento · Dependencia de escáneres físicos · Actualización manual de estados en TMS
  </text>
  <text x="447" y="260" text-anchor="middle" font-size="11" fill="#791F1F">
    · NAS on-premise sin integración · Alto costo de soporte de hardware
  </text>
  <text x="447" y="276" text-anchor="middle" font-size="11" fill="#791F1F">
    · Sin trazabilidad en tiempo real · Riesgo de pérdida de evidencias · Seguridad limitada
  </text>

  <!-- Flecha 0→1 -->
  <line x1="450" y1="318" x2="450" y2="360"
        stroke="#185FA5" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="358" y="320" width="184" height="22" rx="6"
