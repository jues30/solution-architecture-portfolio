  </text>
  <text x="56" y="410" font-size="11" fill="#185FA5">
    Decisión: EFS centraliza imágenes en AWS (mismo entorno TMS) · elimina NAS on-premise · EC2 lee EFS y actualiza estados
  </text>

  <!-- Escáner (persiste, legado) -->
