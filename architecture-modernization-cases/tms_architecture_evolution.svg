  <text x="684" y="515" text-anchor="start" font-size="10" fill="#185FA5">actualiza estados</text>

  <!-- EFS → TMS -->
  <line x1="474" y1="490" x2="474" y2="532"
        stroke="#E65100" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="484" y="515" text-anchor="start" font-size="10" fill="#E65100">evidencias</text>

  <!-- Caja decisión EFS -->
  <rect x="56" y="510" width="316" height="74" rx="8"
        fill="#FFF3E0" fill-opacity="0.7" stroke="#E65100" stroke-width="0.8" stroke-dasharray="4 3"/>
  <text x="214" y="528" text-anchor="middle" font-size="10" font-weight="600" fill="#BF360C">¿Por qué EFS?</text>
  <text x="214" y="544" text-anchor="middle" font-size="10" fill="#BF360C">· Integración nativa con AWS (mismo entorno TMS)</text>
  <text x="214" y="559" text-anchor="middle" font-size="10" fill="#BF360C">· Mayor seguridad y durabilidad vs NAS on-premise</text>
  <text x="214" y="574" text-anchor="middle" font-size="10" fill="#BF360C">· Elimina soporte de hardware de escáneres y NAS</text>

  <!-- Gains fase 1 -->
  <rect x="56" y="604" width="782" height="36" rx="8"
        fill="#E1F5EE" fill-opacity="0.9" stroke="#9FE1CB" stroke-width="0.8" stroke-dasharray="5 3"/>
  <text x="447" y="626" text-anchor="middle" font-size="11" fill="#085041">
    Logros: imágenes centralizadas en AWS EFS · actualización automática via EC2 · descarga desde TMS Web · reduce costos NAS · mejora seguridad
  </text>

  <!-- Flecha 1→2 -->
  <line x1="450" y1="660" x2="450" y2="700"
        stroke="#534AB7" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="332" y="662" width="236" height="22" rx="6"
        fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="450" y="677" text-anchor="middle" font-size="11" fill="#3C3489">Mejora 2 — App móvil + API REST + EFS</text>

