    <text x="474" y="450" text-anchor="middle" font-weight="600" fill="#BF360C">AWS EFS</text>
    <text x="474" y="468" text-anchor="middle" font-size="11" fill="#E65100">Elastic File System</text>
    <text x="474" y="483" text-anchor="middle" font-size="10" fill="#E65100">Reemplaza NAS + SFTP</text>
