  <text x="152" y="935" text-anchor="middle" font-size="10" fill="#3C3489">· Integración directa sin intermediarios</text>
  <text x="152" y="950" text-anchor="middle" font-size="10" fill="#3C3489">· Tiempo real vs latencia de ciclo Cron</text>

