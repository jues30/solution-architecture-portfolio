  <text x="450" y="335" text-anchor="middle" font-size="11" fill="#0C447C">Mejora 1 — Bash + EFS + EC2</text>

  <!-- ══════════════════════════════════════════════════════════
       FASE 1 — BASH + EFS + EC2
  ══════════════════════════════════════════════════════════ -->
