<?xml version="1.0" encoding="UTF-8"?>
<!--
  DIAGRAMA: Migración de monolito on-premise a arquitectura AWS
  AUTOR: [Tu nombre]
  FECHA: 2026
  EDITABLE CON: Inkscape, Figma, Adobe Illustrator, VS Code + SVG Preview

  LAYOUT: flujo top-down en ambas secciones
    AS-IS:  Usuario (top) → Servidor monolítico → Pain points
    TO-BE:  Usuario (top) → ALB → EC2 + EFS (subnet pública) → RDS (subnet privada)

  DECISIONES ARQUITECTÓNICAS:
  - VPC con subnets pública y privada:
      · Separación de red por función y nivel de exposición
      · Principio de mínimo privilegio: RDS nunca expuesto a internet
  - ALB en subnet pública:
      · Único punto de entrada controlado desde internet
      · TLS termination, health checks, desacopla EC2 del exterior
  - EC2 en subnet pública DETRÁS del ALB:
      · Security group: solo acepta tráfico desde el SG del ALB
      · No accesible directo desde internet aunque esté en subnet pública
  - RDS en subnet privada:
      · Inaccesible desde internet por diseño de red
      · Solo EC2 se conecta vía security group
      · Backups automáticos, parches administrados, multi-AZ disponible
  - AWS EFS:
      · Reemplaza disco local del monolito
      · Archivos persistentes y compartidos, desacoplados del ciclo de vida EC2
      · Integración nativa en la VPC

  JUSTIFICACIONES GLOBALES:
  · Resiliencia: componentes independientes y reemplazables
  · Seguridad por capas: subnets + security groups + IAM
  · Elimina deuda técnica: servicios administrados sin gestión de SO ni hardware
  · Alta disponibilidad: ALB con health checks, RDS con failover automático
  · Escalabilidad futura: base para Auto Scaling Group en EC2
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  width="900"
  height="1200"
  viewBox="0 0 900 1200"
  font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
  font-size="13"
>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
            stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <!--
      PALETA:
      GRAY   fill=#F1EFE8  stroke=#5F5E5A  text=#444441   → On-premise / monolito
      BLUE   fill=#E6F1FB  stroke=#185FA5  text=#0C447C   → AWS VPC / ALB
      TEAL   fill=#E1F5EE  stroke=#0F6E56  text=#085041   → Subnet pública / EC2 / EFS
      PURPLE fill=#EEEDFE  stroke=#534AB7  text=#3C3489   → Subnet privada / RDS
      RED    fill=#FCEBEB  stroke=#A32D2D  text=#791F1F   → Problemas
      GREEN  fill=#EAF3DE  stroke=#3B6D11  text=#27500A   → Beneficios
    -->
  </defs>

  <!-- ══════════════════════════════════════════
       TÍTULO
  ══════════════════════════════════════════ -->
  <text x="450" y="34" text-anchor="middle"
        font-size="17" font-weight="600" fill="#2C2C2A">
    Migración de monolito on-premise a arquitectura AWS
  </text>
  <text x="450" y="54" text-anchor="middle"
        font-size="12" fill="#888780">
    Portafolio · Arquitectura de Soluciones TI
  </text>

  <!-- ══════════════════════════════════════════
       AS-IS — DATACENTER ON-PREMISE
       Layout: Usuario (top) → Monolito → Pain points
  ══════════════════════════════════════════ -->

  <!-- [1] Usuario — parte superior, primer nodo del flujo -->
  <g id="as-is-user">
    <rect x="330" y="72" width="240" height="46" rx="10"
          fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="450" y="90" text-anchor="middle" font-weight="600" fill="#444441">Usuario / Internet</text>
    <text x="450" y="108" text-anchor="middle" font-size="11" fill="#A32D2D">Acceso directo al servidor</text>
  </g>

  <!-- Arrow: Usuario → Monolito -->
  <line x1="450" y1="118" x2="450" y2="156"
        stroke="#888780" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="464" y="140" text-anchor="start" font-size="10" fill="#A32D2D">sin intermediario</text>

  <!-- Datacenter container -->
  <rect x="30" y="162" width="840" height="252" rx="16"
        fill="#F1EFE8" fill-opacity="0.45" stroke="#B4B2A9" stroke-width="1"/>
  <text x="56" y="186" font-size="14" font-weight="600" fill="#444441">
    AS-IS — Datacenter on-premise (monolito)
  </text>
  <text x="56" y="204" font-size="11" fill="#888780">
    Servidor físico único · sin separación de capas · sin redundancia
  </text>

  <!-- Monolith inner box -->
  <rect x="56" y="216" width="808" height="172" rx="12"
        fill="#F1EFE8" fill-opacity="0.7" stroke="#888780" stroke-width="1"/>
  <text x="460" y="238" text-anchor="middle" font-size="13" font-weight="600" fill="#444441">
    Servidor monolítico
  </text>
  <text x="460" y="256" text-anchor="middle" font-size="11" fill="#888780">
    Aplicación · base de datos · archivos — todo en una sola máquina física
  </text>

  <!-- App -->
  <g id="as-is-app">
    <rect x="80" y="268" width="220" height="96" rx="10"
          fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="190" y="300" text-anchor="middle" font-weight="600" fill="#444441">Aplicación</text>
    <text x="190" y="320" text-anchor="middle" font-size="11" fill="#5F5E5A">Lógica de negocio</text>
    <text x="190" y="338" text-anchor="middle" font-size="11" fill="#888780">Sin aislamiento de proceso</text>
  </g>

  <!-- Base de datos -->
  <g id="as-is-db">
    <rect x="350" y="268" width="220" height="96" rx="10"
          fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="460" y="300" text-anchor="middle" font-weight="600" fill="#444441">Base de datos</text>
    <text x="460" y="320" text-anchor="middle" font-size="11" fill="#5F5E5A">Sin red privada</text>
    <text x="460" y="338" text-anchor="middle" font-size="11" fill="#888780">Backups manuales</text>
  </g>

  <!-- Archivos -->
  <g id="as-is-files">
    <rect x="620" y="268" width="220" height="96" rx="10"
          fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
    <text x="730" y="300" text-anchor="middle" font-weight="600" fill="#444441">Archivos</text>
    <text x="730" y="320" text-anchor="middle" font-size="11" fill="#5F5E5A">Disco local</text>
    <text x="730" y="338" text-anchor="middle" font-size="11" fill="#888780">Sin respaldo centralizado</text>
  </g>

  <!-- Pain points -->
  <rect x="30" y="426" width="840" height="66" rx="10"
        fill="#FCEBEB" fill-opacity="0.6" stroke="#F09595" stroke-width="0.8" stroke-dasharray="5 3"/>
  <text x="450" y="446" text-anchor="middle" font-size="11" font-weight="600" fill="#A32D2D">
    Problemas identificados
  </text>
  <text x="450" y="464" text-anchor="middle" font-size="11" fill="#791F1F">
    · Punto único de falla · Sin alta disponibilidad · Escalado requiere downtime · Sin separación de red
  </text>
  <text x="450" y="480" text-anchor="middle" font-size="11" fill="#791F1F">
    · Deuda técnica acumulada · Backups manuales · Exposición directa a internet · Sin DR
  </text>

  <!-- ─── Flecha migración ─── -->
  <line x1="450" y1="496" x2="450" y2="534"
        stroke="#185FA5" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="340" y="498" width="220" height="24" rx="6"
        fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8"/>
  <text x="450" y="510" text-anchor="middle" font-size="11" fill="#0C447C">
    Migración a arquitectura AWS
  </text>

  <!-- ══════════════════════════════════════════
       TO-BE — AWS VPC
       Layout top-down: Usuario → ALB → EC2+EFS → RDS
  ══════════════════════════════════════════ -->

  <!-- VPC outer container -->
  <rect x="30" y="542" width="840" height="582" rx="16"
        fill="#E6F1FB" fill-opacity="0.12" stroke="#185FA5" stroke-width="1"/>
  <text x="56" y="566" font-size="14" font-weight="600" fill="#0C447C">
    TO-BE — AWS VPC (arquitectura destino)
  </text>
  <text x="56" y="584" font-size="11" fill="#185FA5">
    Red privada aislada · separación por subnets · acceso controlado por security groups e IAM
  </text>

  <!-- [1] Usuario / Internet — TOP del TO-BE -->
  <g id="to-be-user">
    <rect x="330" y="598" width="240" height="46" rx="10"
          fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
    <text x="450" y="616" text-anchor="middle" font-weight="600" fill="#444441">Usuario / Internet</text>
    <text x="450" y="634" text-anchor="middle" font-size="11" fill="#185FA5">HTTPS → DNS del ALB</text>
  </g>

  <!-- Arrow: Usuario → ALB (straight down, no crossing) -->
  <line x1="450" y1="644" x2="450" y2="682"
        stroke="#185FA5" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- [2] ALB -->
  <g id="to-be-alb">
    <rect x="250" y="690" width="400" height="66" rx="10"
          fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
    <text x="450" y="714" text-anchor="middle" font-weight="600" fill="#0C447C">ALB — Application Load Balancer</text>
    <text x="450" y="732" text-anchor="middle" font-size="11" fill="#185FA5">TLS termination · health checks · único punto de entrada desde internet</text>
    <text x="450" y="748" text-anchor="middle" font-size="10" fill="#185FA5">Internet Gateway → route table pública → ALB</text>
  </g>

  <!-- Arrow: ALB → EC2 (straight down into subnet pública) -->
  <line x1="450" y1="756" x2="450" y2="810"
        stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="464" y="786" text-anchor="start" font-size="10" fill="#0F6E56">enruta tráfico</text>

  <!-- Subnet pública -->
  <rect x="56" y="818" width="786" height="186" rx="12"
        fill="#E1F5EE" fill-opacity="0.25" stroke="#0F6E56" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="76" y="840" font-size="12" font-weight="600" fill="#085041">Subnet pública</text>
  <text x="76" y="856" font-size="10" fill="#0F6E56">
    Solo acepta tráfico desde el ALB · SG del EC2 bloquea acceso directo desde internet
  </text>

  <!-- EC2 -->
  <g id="to-be-ec2">
    <rect x="80" y="870" width="280" height="110" rx="10"
          fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="220" y="898" text-anchor="middle" font-weight="600" fill="#085041">EC2</text>
    <text x="220" y="918" text-anchor="middle" font-size="11" fill="#0F6E56">Servidor de aplicaciones</text>
    <text x="220" y="936" text-anchor="middle" font-size="10" fill="#0F6E56">SG: solo puerto app desde ALB</text>
    <text x="220" y="952" text-anchor="middle" font-size="10" fill="#0F6E56">Monta EFS · conecta a RDS</text>
    <text x="220" y="968" text-anchor="middle" font-size="10" fill="#085041">Subnet pública · acceso solo vía ALB</text>
  </g>

  <!-- EFS -->
  <g id="to-be-efs">
    <rect x="540" y="870" width="280" height="110" rx="10"
          fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
    <text x="680" y="898" text-anchor="middle" font-weight="600" fill="#085041">AWS EFS</text>
    <text x="680" y="918" text-anchor="middle" font-size="11" fill="#0F6E56">Elastic File System</text>
    <text x="680" y="936" text-anchor="middle" font-size="10" fill="#0F6E56">Archivos persistentes y compartidos</text>
    <text x="680" y="952" text-anchor="middle" font-size="10" fill="#0F6E56">Reemplaza disco local del monolito</text>
    <text x="680" y="968" text-anchor="middle" font-size="10" fill="#085041">Desacoplado del ciclo de vida EC2</text>
  </g>

  <!-- Arrow EC2 ↔ EFS — horizontal inside subnet, no crossing -->
  <line x1="362" y1="925" x2="538" y2="925"
        stroke="#0F6E56" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="450" y="917" text-anchor="middle" font-size="10" fill="#0F6E56">mount NFS</text>

  <!-- Arrow EC2 → RDS: straight down from EC2, then into RDS -->
  <line x1="220" y1="982" x2="220" y2="1040"
        stroke="#534AB7" stroke-width="1.2"/>
  <path d="M220 1040 L370 1068" fill="none"
        stroke="#534AB7" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="232" y="1014" text-anchor="start" font-size="10" fill="#534AB7">SQL privado</text>

  <!-- Subnet privada -->
  <rect x="56" y="1018" width="786" height="148" rx="12"
        fill="#EEEDFE" fill-opacity="0.25" stroke="#534AB7" stroke-width="1" stroke-dasharray="6 3"/>
  <text x="76" y="1040" font-size="12" font-weight="600" fill="#3C3489">Subnet privada</text>
  <text x="76" y="1056" font-size="10" fill="#534AB7">
    Sin ruta a internet · solo EC2 puede conectarse a RDS vía security group
  </text>

  <!-- RDS -->
  <g id="to-be-rds">
    <rect x="230" y="1076" width="440" height="70" rx="10"
          fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
    <text x="450" y="1100" text-anchor="middle" font-weight="600" fill="#3C3489">Amazon RDS</text>
    <text x="450" y="1118" text-anchor="middle" font-size="11" fill="#534AB7">Base de datos administrada · subnet privada</text>
    <text x="450" y="1134" text-anchor="middle" font-size="10" fill="#534AB7">Backups automáticos · parches administrados · multi-AZ disponible</text>
  </g>

  <!-- ══════════════════════════════════════════
       BENEFICIOS Y LEYENDA
  ══════════════════════════════════════════ -->
  <rect x="30" y="1160" width="840" height="28" rx="8"
        fill="#EAF3DE" fill-opacity="0.8" stroke="#9FE1CB" stroke-width="0.8"/>
  <text x="450" y="1174" text-anchor="middle" font-size="11" fill="#27500A">
    Beneficios: resiliencia · seguridad por capas · sin deuda técnica de hardware · alta disponibilidad · escalabilidad futura
  </text>

  <!-- Leyenda -->
  <text x="30" y="1198" font-size="10" fill="#B4B2A9">
    Leyenda:
  </text>
  <rect x="94" y="1186" width="12" height="12" rx="2"
        fill="#F1EFE8" stroke="#888780" stroke-width="1"/>
  <text x="112" y="1197" font-size="10" fill="#5F5E5A">On-premise</text>

  <rect x="200" y="1186" width="12" height="12" rx="2"
        fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="218" y="1197" font-size="10" fill="#0C447C">VPC / ALB</text>

  <rect x="302" y="1186" width="12" height="12" rx="2"
        fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="320" y="1197" font-size="10" fill="#085041">Subnet pública · EC2 · EFS</text>

  <rect x="510" y="1186" width="12" height="12" rx="2"
        fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="528" y="1197" font-size="10" fill="#3C3489">Subnet privada · RDS</text>

  <text x="450" y="1212" text-anchor="middle" font-size="10" fill="#B4B2A9">
    Portafolio · Arquitectura de Soluciones TI · Editable en Inkscape, Figma, Illustrator o VS Code
  </text>

</svg>
